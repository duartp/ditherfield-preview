<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0A0B">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ditherfield">
<title>ditherfield</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <b class="mark">ditherfield</b>
    <span id="fps" class="mono dim"></span>
    <button id="undoBtn" class="icon" type="button" aria-label="undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="playBtn" class="icon on" type="button" aria-label="play / pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button>
    <button id="soundBtn" class="icon" type="button" aria-pressed="false" aria-label="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8c1.5 1.2 1.5 6.8 0 8M18.5 5.5c3 2.5 3 10.5 0 13"/></svg></button>
  </header>
  <div id="stage"><canvas id="cv" width="540" height="675" aria-label="the piece; tap to hide or show the controls"></canvas></div>
  <section id="panel" aria-label="controls">
    <nav id="secs" aria-label="sections"></nav>
    <div id="body"></div>
  </section>
  <nav id="tabs" aria-label="tabs"></nav>
</div>
<div id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head"><b id="sheetTitle"></b><button id="sheetClose" class="btn" type="button">done</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/df.js"></script>
<script src="js/tables.js"></script>
<script src="js/gl.js"></script>
<script src="js/params.js"></script>
<script src="js/colour.js"></script>
<script src="js/mod.js"></script>
<script src="js/shaders.js"></script>
<script src="js/engine.js"></script>
<script src="js/synth.js"></script>
<script src="js/state.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
